name: nhdip

# ─────────────────────────────────────────────────────────────────────────────
# NH AI 경영 의사결정 플랫폼 — 전 구성 단일 기동 (설계 §19.1, 요구사항 DEP-01~04)
#
#   make up        → 5개 서비스 기동 (최초 기동 시 마이그레이션 + 기본 설정 + 목데이터 시드 자동)
#   make down      → 중지 (데이터 유지)
#   make reset     → 중지 + 볼륨 삭제 (초기 상태로)
#
#   web       :3000  Next.js (로그인 · 업무 화면 · 관리자)  — /backend/* 를 api 로 프록시
#   api       :8000  FastAPI (인증 · 화면 API · 관리자 API)
#   worker    -      아웃박스 디스패처 · 워크플로우 엔진 · 적재 · 그래프 투영
#   postgres  -      PostgreSQL 16 + pgvector (원장 · 설정 · 이력 · 벡터 · 작업 큐) + litellm DB
#   neo4j     :7474  온톨로지 그래프 (브라우저 UI) / :7687 bolt
#   litellm   :4000  (선택 · 기본 꺼짐) 내장 LiteLLM 게이트웨이 — 외부 LiteLLM 을 쓰면 띄우지 않는다.
#                    켜려면 .env 에 COMPOSE_PROFILES=litellm
#   elasticsearch :9200 검색 엔진(nori 포함) — 3-way 구성(설계 §24): PostgreSQL 원장 · ES 키워드/의미 · Neo4j 그래프. 꺼져 있으면 검색은 PostgreSQL 로 축소 동작
# ─────────────────────────────────────────────────────────────────────────────

# 로그 회전 (B.32) — 컨테이너 로그가 디스크를 채우지 않도록
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-api-env: &api-env
  TZ: ${TZ:-Asia/Seoul}
  NHDIP_ENV: ${NHDIP_ENV:-prod}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nhdip}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 가 .env 에 필요합니다 (make env)}@postgres:5432/${POSTGRES_DB:-nhdip}
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD 가 .env 에 필요합니다 (make env)}
  FILESTORE_DIR: /data/files
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET 가 .env 에 필요합니다 (make env)}
  CONFIG_ENC_KEY: ${CONFIG_ENC_KEY:?CONFIG_ENC_KEY 가 .env 에 필요합니다 (make env)}
  COOKIE_SECURE: ${COOKIE_SECURE:-0}
  # 변경 요청 Origin 허용 목록(쉼표, 예: https://nhdip.example) — 비우면 같은 출처만 (B.32)
  TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
  # 사용자 IP 판정 — X-Forwarded-For 를 믿을 바로 앞 프록시 대역(기본: 이 컴퓨터 + Docker 내부망)
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32,::1/128,web}
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
  # API 문서(/docs) — 운영(prod) 기본 꺼짐. true 로 켠다
  API_DOCS: ${API_DOCS:-}
  # 트랜잭션 유휴 제한(ms) — 잠금을 쥔 채 멈춘 연결을 DB 가 끊는다. 0 = 끄기
  DB_IDLE_TX_TIMEOUT_MS: ${DB_IDLE_TX_TIMEOUT_MS:-600000}
  BOOTSTRAP_ADMIN_EMP_NO: ${BOOTSTRAP_ADMIN_EMP_NO:-00000001}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD 가 .env 에 필요합니다 (make env)}
  # 시드 시 기본 LLM 연결로 등록할 값 (이후 관리자 화면에서 변경)
  # 외부 LiteLLM 주소 · 키 — 최초 시드 때만 쓴다(비우면 관리자 [LLM 연동] 에서 입력)
  LLM_DEFAULT_BASE_URL: ${LLM_DEFAULT_BASE_URL:-}
  LLM_DEFAULT_API_KEY: ${LLM_DEFAULT_API_KEY:-}
  LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-}
  # 비워 두면 시연용 사용자를 만들지 않는다
  DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-}
  # 업로드 백신 명령(선택) — 예: clamdscan --no-summary --fdpass {path}  (비우면 내장 검사만)
  UPLOAD_AV_COMMAND: ${UPLOAD_AV_COMMAND:-}
  # SSO(OIDC) — OIDC_ISSUER 를 넣으면 로그인 화면에 SSO 버튼이 생긴다 (비우면 사번 로그인만)
  OIDC_ISSUER: ${OIDC_ISSUER:-}
  OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
  OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
  OIDC_EMP_CLAIM: ${OIDC_EMP_CLAIM:-emp_no}
  OIDC_LOCAL_LOGIN: ${OIDC_LOCAL_LOGIN:-all}
  # 사내 SSO(INISAFE Nexess 티켓 · Phase R) — NC_SSO_ENABLED=1 이면 로그인 화면에 버튼. 티켓은 sso-verifier(--profile sso)가 푼다
  NC_SSO_ENABLED: ${NC_SSO_ENABLED:-0}
  NC_SSO_LABEL: ${NC_SSO_LABEL:-NH 통합 로그인(SSO)}
  NC_SSO_LOGIN_URL: ${NC_SSO_LOGIN_URL:-https://sso.nonghyup.com:15502/nls/clientLogin.jsp}
  NC_SSO_ALLOWED_TOA: ${NC_SSO_ALLOWED_TOA:-2,3}
  NC_SSO_VERIFIER: ${NC_SSO_VERIFIER:-http}
  NC_SSO_VERIFIER_URL: ${NC_SSO_VERIFIER_URL:-http://sso-verifier:8090}
  NC_SSO_VERIFIER_TOKEN: ${NC_SSO_VERIFIER_TOKEN:-}
  NC_SSO_LOCAL_LOGIN: ${NC_SSO_LOCAL_LOGIN:-all}
  # 운영 알림 채널(선택) — 비우면 알림은 기록만 (관리자 [운영 알림 · 비용])
  ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
  ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
  ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-25}
  ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
  ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
  ALERT_SMTP_FROM: ${ALERT_SMTP_FROM:-}
  ALERT_SMTP_TO: ${ALERT_SMTP_TO:-}
  ALERT_SMTP_STARTTLS: ${ALERT_SMTP_STARTTLS:-1}
  # 검색 엔진 Elasticsearch (3-way 구성 · 설계 §24) — 기본은 내장 elasticsearch 서비스. .env 에서 ES_URL= 로 비우면(명시) PostgreSQL 만 쓴다
  ES_URL: ${ES_URL-http://elasticsearch:9200}
  ES_USER: ${ES_USER-elastic}
  ES_PASSWORD: ${ES_PASSWORD:-}
  ES_INDEX: ${ES_INDEX:-nhdip-kb-chunk}
  ES_DOC_INDEX: ${ES_DOC_INDEX:-nhdip-doc-chunk}
  ES_VERIFY_CERTS: ${ES_VERIFY_CERTS:-1}
  ES_CA_CERTS: ${ES_CA_CERTS:-}

services:
  postgres:
    # 이미지 고정 (B.32) — 태그 + 다중 아키텍처 digest. 올릴 때는 PG_IMAGE 로 바꾼다
    image: ${PG_IMAGE:-pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a}
    logging: *logging
    environment:
      TZ: ${TZ:-Asia/Seoul}
      POSTGRES_USER: ${POSTGRES_USER:-nhdip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 가 .env 에 필요합니다 (make env)}
      POSTGRES_DB: ${POSTGRES_DB:-nhdip}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 최초 1회: litellm 전용 데이터베이스 생성
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nhdip} -d ${POSTGRES_DB:-nhdip}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.26-community@sha256:c7d25c0eeebfe125718d58b72ed5d663c85d0479047733845eb2237c67ce8069}
    logging: *logging
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD 가 .env 에 필요합니다 (make env)}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      # 관리용 포트는 기본으로 이 컴퓨터에서만 (외부 공개는 ADMIN_BIND=0.0.0.0)
      - "${ADMIN_BIND:-127.0.0.1}:${NEO4J_HTTP_PORT:-7474}:7474"
      - "${ADMIN_BIND:-127.0.0.1}:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  litellm:
    # 선택 서비스 (B.36) — 외부 LiteLLM 을 관리자 화면에 등록해 쓰는 것이 기본. 내장 게이트웨이가 필요할 때만 COMPOSE_PROFILES=litellm
    profiles: ["litellm"]
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm:main-stable@sha256:625981c83410a3ea68eb0697590a57ec1d764d634514d54fa5db0591077ee839}
    logging: *logging
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nhdip}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 가 .env 에 필요합니다 (make env)}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      STORE_MODEL_IN_DB: "True"
      UI_USERNAME: ${LITELLM_UI_USERNAME:-admin}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD:-}
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:${LITELLM_PORT:-4000}:4000"
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness')\""]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  elasticsearch:
    # 3-way 구성의 검색 엔진 (설계 §24) — AI 어시스턴트 · 워크플로 근거 검색의 키워드(BM25 + nori) · 의미(kNN). 분석 결과 · 문서 색인 두 개.
    # .env 의 ES_PASSWORD(= elastic 계정 비밀번호, make env 가 생성) · ES_URL=http://elasticsearch:9200 · ES_USER=elastic.
    # 호스트에 vm.max_map_count=262144 이상이 필요하다(sysctl). 데이터 원장은 PostgreSQL 이라 ES 볼륨을 잃어도 `python -m nhdip.cli kb-es --rebuild` 로 복구된다.
    build:
      context: ./infra/elasticsearch
      args:
        ES_IMAGE_BASE: ${ES_IMAGE_BASE:-docker.elastic.co/elasticsearch/elasticsearch:9.5.4}
    image: nhdip/elasticsearch:${IMAGE_TAG:-local}
    logging: *logging
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      # 컴포즈 내부망(api · worker)에서만 접근하므로 HTTP 는 평문. 망 밖에 열 때는 TLS 를 켜고 ES_URL 을 https 로
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ES_PASSWORD:-}
      ES_JAVA_OPTS: -Xms${ES_HEAP:-1g} -Xmx${ES_HEAP:-1g}
      bootstrap.memory_lock: "false"
      # 디스크 기준을 비율(기본 85 · 90 · 95%) 대신 남은 용량으로 — 디스크가 큰 서버(또는 CI 러너)에서 비율 기준을 넘으면 새 색인(보안 색인 포함)을
      # 배치하지 못해 elastic 계정 인증이 503 으로 막힌다(CI 에서 확인). 남은 용량 기준이면 보호는 유지된다(ES_DISK_* 로 조정)
      cluster.routing.allocation.disk.watermark.low: ${ES_DISK_LOW:-2gb}
      cluster.routing.allocation.disk.watermark.high: ${ES_DISK_HIGH:-1gb}
      cluster.routing.allocation.disk.watermark.flood_stage: ${ES_DISK_FLOOD:-500mb}
    ulimits:
      nofile: {soft: 65535, hard: 65535}
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:${ES_PORT:-9200}:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      # curl 이 이미지에 없을 수도 있어(공식 이미지가 보장하지 않음) 없으면 포트 확인으로 — 실제 동작은 kb-es --check 가 본다
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://127.0.0.1:9200/_cluster/health >/dev/null || { command -v curl >/dev/null && exit 1; bash -c 'exec 3<>/dev/tcp/127.0.0.1/9200'; }"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # 파일 저장소 권한 (Phase C) — 한 번 실행하고 끝나는 준비 단계. 예전에 root 소유로 만들어진 볼륨도
  # api · worker 계정(uid 10001)이 쓸 수 있게 한다(업무 자료 요청 파일 · 업로드 원본 보관)
  files-init:
    image: nhdip/api:${IMAGE_TAG:-local}
    pull_policy: never
    user: "0:0"
    entrypoint: ["sh", "-c", "mkdir -p /data/files/requests && chown -R 10001:10001 /data/files"]
    logging: *logging
    volumes:
      - filestore:/data/files
    restart: "no"

  api:
    build:
      context: ./apps/api
    image: nhdip/api:${IMAGE_TAG:-local}
    command: ["api"]
    logging: *logging
    environment:
      <<: *api-env
      RUN_MIGRATIONS: "1"
      SEED_ON_START: "1"
      # 기동 시드는 플랫폼만(Phase O · BIZ-01) — 관리자 계정 · 플랫폼 화면 · 에이전트 · 프롬프트 · 공통 흐름 · 시스템 온톨로지.
      # 업무 구조(지표 · 규칙 · 업무 흐름 · 화면 연결 · 조직 · 화면 · 정의서)는 관리자 [업무 구성]에 구성 파일로 올리고, 자료는 [데이터셋·문서]에 올린다.
      # 예전 SEED_DATASET_DEFS · SEED_COLUMN_CONTRACTS · SEED_CONTRACT_EXPECTED 는 읽지 않는다. 예전 시드가 든 DB 는 cli remove-seed-structure
      # API 전용 DB 계정 (B.33) — 데이터 조작만 가능, 감사 로그는 조회 · 추가만. 비우면 소유자 계정으로 접속
      APP_DB_USER: ${APP_DB_USER:-nhdip_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
    volumes:
      - filestore:/data/files
      # 사내 SSO 벤더 JS(NexessDemonFunc.js 등) — 웹 /nc/* 로 서빙 (Phase R · 비어 있어도 됨)
      - ./infra/sso/nc-js:/opt/nc-js:ro
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_started}
      files-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  worker:
    image: nhdip/api:${IMAGE_TAG:-local}
    # api 서비스가 빌드한 같은 이미지를 쓴다(레지스트리에서 받지 않음)
    pull_policy: never
    command: ["worker"]
    logging: *logging
    environment:
      <<: *api-env
    volumes:
      - filestore:/data/files
    depends_on:
      api: {condition: service_healthy}
    # 워커 심장박동(5초)이 60초 넘게 끊기면 비정상 (B.32)
    healthcheck:
      test: ["CMD", "python", "-m", "nhdip.worker", "--health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  sso-verifier:
    # 사내 SSO 티켓 검증기 (Phase R) — 벤더 jar(infra/sso-verifier/libs)로 INISAFE Nexess 티켓을 푼다. 내부망 전용(포트를 열지 않음)
    # 켜기: .env 에 COMPOSE_PROFILES=sso · NC_SSO_ENABLED=1 · NC_SSO_VERIFIER_TOKEN(16자 이상)
    profiles: ["sso"]
    build:
      context: ./infra/sso-verifier
    image: nhdip/sso-verifier:${IMAGE_TAG:-local}
    logging: *logging
    environment:
      TZ: ${TZ:-Asia/Seoul}
      VERIFIER_TOKEN: ${NC_SSO_VERIFIER_TOKEN:-}
      PORT: "8090"
    volumes:
      - ./infra/sso-verifier/libs:/app/libs:ro
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:8000
    image: nhdip/web:${IMAGE_TAG:-local}
    logging: *logging
    environment:
      TZ: ${TZ:-Asia/Seoul}
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      API_INTERNAL_URL: http://api:8000
      # 앞에 사내 L7 프록시가 있어 X-Forwarded-For 를 그 프록시가 채우면 1 (기본 0 = 사용자가 보낸 값은 지움)
      TRUST_UPSTREAM_PROXY: ${TRUST_UPSTREAM_PROXY:-0}
      # 사내 SSO 중계 페이지(sso-proxy.html)가 통신할 PC NC 에이전트 출처 (Phase R · CSP 예외)
      NC_SSO_AGENT_ORIGIN: ${NC_SSO_AGENT_ORIGIN:-https://127.0.0.1:13015}
    ports:
      - "${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  neo4jdata:
  esdata:
  filestore:
