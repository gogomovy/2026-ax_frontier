name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nhdip
          POSTGRES_PASSWORD: nhdip
          POSTGRES_DB: nhdip
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nhdip -d nhdip" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql+psycopg://nhdip:nhdip@localhost:5432/nhdip
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
      - name: 계층 의존 규칙 (import-linter)
        run: lint-imports
      - name: pytest + 계산 커널 커버리지 게이트(90%)
        run: python -m pytest -q tests --cov --cov-config=.coveragerc --cov-report=term-missing
      - name: 교란 검사 (빈 DB → 정의 시드 → 엑셀 업로드 → 엑셀 대조 → 교란 업로드 → 하드코딩 0 · Phase I)
        env:
          NHDIP_SAMPLE_UPLOAD: "1"  # 시험 DB 전용 — 플랫폼은 시연 자료를 넣지 않는다(M.20)
          DATABASE_URL: postgresql+psycopg://nhdip:nhdip@localhost:5432/nhdip_selftest
          NEO4J_URI: bolt://127.0.0.1:1
          SESSION_SECRET: ci-selftest-secret-ci-selftest-secret
          BOOTSTRAP_ADMIN_EMP_NO: "00000001"
          BOOTSTRAP_ADMIN_PASSWORD: Selftest1234!
          FILESTORE_DIR: /tmp/nhdip-selftest-files
          NHDIP_USE_APP_ROLE: "0"
          SEED_DATASET_DEFS: "1"  # 시험 스택만 시연 정의 · 정의서를 넣는다(M.25 — 플랫폼 기본은 넣지 않음)
          SEED_COLUMN_CONTRACTS: "1"
          SEED_CONTRACT_EXPECTED: "1"
        run: |
          python -c "import psycopg; c = psycopg.connect('postgresql://nhdip:nhdip@localhost:5432/nhdip', autocommit=True); c.execute('DROP DATABASE IF EXISTS nhdip_selftest WITH (FORCE)'); c.execute('CREATE DATABASE nhdip_selftest')"
          alembic upgrade head
          python -m nhdip.cli seed
          python -m nhdip.sample selftest --json /tmp/selftest.json > /tmp/selftest.log || { tail -c 4000 /tmp/selftest.log; exit 1; }
          python -c "import json; d = json.load(open('/tmp/selftest.json')); print({k: d[k] for k in ('ok', 'exempt')}, 'static', len(d['static']))"

  web:
    name: frontend (typecheck · lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: unit tests (vitest)
        run: npm test
      - name: build
        run: npx next build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: e2e (docker compose · browser)
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: .env (비밀값 자동 생성 · 시험 스택은 시연 정의 · 정의서 시드)
        run: |
          bash infra/scripts/ensure-env.sh
          bash infra/scripts/set-env.sh SEED_DATASET_DEFS 1
          bash infra/scripts/set-env.sh SEED_COLUMN_CONTRACTS 1
          bash infra/scripts/set-env.sh SEED_CONTRACT_EXPECTED 1
      - name: Elasticsearch 커널 설정 (vm.max_map_count — 3-way 검색 엔진) · 디스크 확보(쓰지 않는 도구 정리)
        run: |
          sudo sysctl -w vm.max_map_count=262144
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: compose up (시드 = 정의만 · 시연 자료는 다음 단계에서 HTTP 업로드)
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: 시연 자료 패키지 업로드 (시험 스택 전용 · 엑셀 · CSV · PDF → 실제 업로드 API · Phase I)
        run: docker compose exec -T -e NHDIP_SAMPLE_UPLOAD=1 api python -m nhdip.sample upload --base-url http://localhost:8000
      - name: wait for precompute (이벤트 · 작업 처리 완료까지)
        run: docker compose exec -T api python -m nhdip.cli wait-idle --timeout 300 --settle 10
      - name: 엑셀 ↔ 화면 대조 (엑셀에서 독립 계산한 기대값 = 화면 API 수치)
        run: docker compose exec -T api python -m nhdip.sample verify --base-url http://localhost:8000
      - name: 3-way 검색 색인 (PostgreSQL → Elasticsearch 동기화 · 점검)
        run: |
          docker compose exec -T api python -m nhdip.cli kb-es --sync
          docker compose exec -T api python -m nhdip.cli kb-es --check
      - name: e2e
        run: make e2e
        env:
          E2E_OUT: ${{ github.workspace }}/e2e-out
          E2E_EXPECT_ES: "1"
      - name: 자동 접근성 점검 (axe-core · serious 이상이면 실패)
        run: make a11y
        env:
          E2E_OUT: ${{ github.workspace }}/e2e-out
      - name: golden set (compose 스택 · 선계산 후)
        run: docker compose exec -T api python -m nhdip.evals --json /tmp/eval.json
      - name: perf smoke (참고용 · 공용 러너 편차로 실패해도 계속)
        continue-on-error: true
        run: docker compose exec -T api python -m nhdip.perf --n 10 --c 2
      - name: logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-out
          if-no-files-found: ignore

  # 업로드 기반 에이전트 시험(B.40 · B.45) — 수동 실행(workflow_dispatch) 때만. 약 7~10분이라 push CI 에는 넣지 않는다.
  # LLM 키를 CI 에 두지 않으므로 LLM 없는 모드(규칙 판단 · 기존 문장 · 별칭 사전 추출 · 질의 정리)를 확인한다.
  upload:
    name: upload test (rule mode · manual)
    if: github.event_name == 'workflow_dispatch'
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: .env (비밀값 자동 생성)
        run: bash infra/scripts/ensure-env.sh
      - name: Elasticsearch 커널 설정 (vm.max_map_count — 3-way 검색 엔진)
        run: sudo sysctl -w vm.max_map_count=262144
      - name: images (기본 스택과 같은 nhdip/api · nhdip/web · nhdip/elasticsearch)
        run: docker compose build
      - name: upload test (별도 스택 nhdipe2e)
        run: make upload-test
        env:
          E2E_EXPECT_LLM: "0"
          E2E_OUT: ${{ github.workspace }}/upload-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upload-test
          path: upload-out
          if-no-files-found: ignore
