<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>NH 통합 로그인</title>
<link rel="icon" href="/favicon.ico" />
<style>
  body { margin: 0; font-family: "Pretendard", system-ui, -apple-system, "Malgun Gothic", sans-serif; background: #f6f7fb; color: #1f2430; }
  main { max-width: 420px; margin: 18vh auto 0; padding: 32px; background: #fff; border: 1px solid #e6e8ef; border-radius: 16px; text-align: center; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { font-size: 13px; line-height: 1.6; color: #5b6170; margin: 0; }
  .spin { width: 28px; height: 28px; margin: 0 auto 16px; border: 3px solid #e6e8ef; border-top-color: #5b3df5; border-radius: 50%; animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .err { display: none; margin-top: 16px; padding: 12px; border-radius: 10px; background: #fdecec; color: #b42318; font-size: 13px; text-align: left; }
  .err a { color: #5b3df5; font-weight: 700; }
  form { display: none; margin-top: 18px; text-align: left; }
  label { display: block; font-size: 12px; font-weight: 700; color: #5b6170; margin: 10px 0 4px; }
  input, select { width: 100%; box-sizing: border-box; height: 36px; border: 1px solid #d5d8e1; border-radius: 8px; padding: 0 10px; font-size: 13px; }
  button { margin-top: 14px; width: 100%; height: 38px; border: 0; border-radius: 999px; background: #1f2430; color: #fff; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<main>
  <div class="spin" id="spin" aria-hidden="true"></div>
  <h1 id="title">통합 로그인 확인 중</h1>
  <p id="msg" role="status" aria-live="polite">PC 의 통합 로그인(NC) 에이전트에서 인증 정보를 받고 있습니다…</p>
  <div class="err" id="err" role="alert"></div>
  <!-- 개발 전용(NC_SSO_VERIFIER=stub) — 에이전트 없이 사번으로 흐름 시험. 운영에서는 서버가 stub 을 거부한다 -->
  <form id="stub">
    <label for="stub-emp">사번(개발용 흉내)</label>
    <input id="stub-emp" inputmode="text" maxlength="20" autocomplete="username" required />
    <label for="stub-toa">인증 방식(TOA)</label>
    <select id="stub-toa"><option value="3">3 · 운영 ID/PW</option><option value="2">2 · 운영 인증서</option><option value="93">93 · 개발 ID/PW</option></select>
    <button type="submit">개발용 SSO 로그인</button>
  </form>
</main>
<!-- 벤더 NC 스크립트 — NexessDemonFunc.js 가 /nc/json2.js · /nc/jquery-3.5.1(.min).js 를 다시 읽는다 -->
<script src="/nc/jquery-3.5.1.min.js"></script>
<script src="/nc/json2.js"></script>
<script src="/nc/NexessDemonFunc.js"></script>
<script src="/sso-proxy.js"></script>
</body>
</html>
