# ─────────────────────────────────────────────────────────────────────────────
# 폐쇄망 배포값 — 이 파일만 채워서 쓴다.  helm install nhdip chart/nhdip-1.0.0.tgz -n nhdip -f values-closed.yaml
#  · 꼭 채울 것 4가지: global.imageRegistry(Harbor) · global.nodeSelector(서버) · ingress.host(도메인) · persistence(저장소)
#
#  · "" 로 비워 둔 [채우기] 항목을 내부망 값으로 채운다 (설명: 폐쇄망_헬름배포_가이드.md §4)
#  · 비밀값은 여기에 쓰지 않는다 — helm install 이 Secret(nhdip-secrets)을 무작위 값으로 만든다(별도 스크립트 없음)
#  · 비어 있는 [필수] 값이 있으면 helm install 이 무엇을 채울지 알려 주고 멈춘다
# ─────────────────────────────────────────────────────────────────────────────

# ── 이미지 (Harbor) ─────────────────────────────────────────────
# 이미지 = <global.imageRegistry>/<images.*.repository>:<tag>
#   Harbor 에 <Harbor 주소>/<프로젝트>/<원래 이름:태그> 로 올리면(docker load → tag → push) 아래 이름은 그대로 두고 global.imageRegistry 만 채운다
#   예) imageRegistry 16.24.113.77/nhnavi → 16.24.113.77/nhnavi/nhdip/api:1.0.0
#   다른 경로 · 이름으로 올렸다면 repository 를 프로젝트 뒤 경로로 바꾼다(태그를 바꿨으면 tag 도)
images:
  api: {repository: nhdip/api, tag: ""}                 # 비운 tag = 1.0.0(차트 appVersion) · api · worker 공용
  web: {repository: nhdip/web, tag: ""}
  elasticsearch: {repository: nhdip/elasticsearch, tag: ""}
  postgres: {repository: pgvector/pgvector, tag: pg16}
  neo4j: {repository: neo4j, tag: 5.26-community}
  ssoVerifier: {repository: nhdip/sso-verifier, tag: ""}   # 사내 SSO 를 켤 때만 받음
  # LiteLLM 은 띄우지 않는다 — 사내에서 운영 중인 LiteLLM 을 app.llm.baseUrl 로 연결(차트 기본 litellm.enabled: false)

global:
  # [채우기·필수] Harbor 주소/프로젝트 (태그 · 이미지 이름 제외) — 예: 16.24.113.77/nhnavi
  #   프로젝트는 Harbor 화면에서 먼저 만든다. 사내 다른 솔루션도 같은 Harbor(예: 16.24.113.77/litellm/litellm)를 쓴다
  imageRegistry: ""
  # 같은 태그(1.0.0)로 이미지를 다시 올렸다면 Always — 노드에 받아 둔 예전 이미지를 쓰지 않게
  imagePullPolicy: IfNotPresent
  # [채우기·선택] Harbor 프로젝트가 비공개(private)면 docker-registry Secret 이름. 예: [harbor-pull]  (공개 프로젝트면 비워 둠)
  imagePullSecrets: []
  # [채우기·필수] 띄울 서버(노드) — kubectl get nodes 의 이름. 예: kubernetes.io/hostname: nhnavi-node01
  nodeSelector:
    kubernetes.io/hostname: ""
  # [채우기·선택] 서버에 taint 가 있으면
  tolerations: []

# ── 접속 도메인 ──────────────────────────────────────────────────
ingress:
  # 인그레스 클래스 — 사내 K8s 는 nginx (kubectl get ingressclass 로 한 번 확인)
  className: "nginx"
  # [채우기·필수] 도메인 — 방화벽이 열린 인그레스 VIP 에 연결(DNS 등록)된 이름. 예: nhnavi.nbaihub.nhbank
  #   (사내 다른 솔루션 예: dev-aidriven-gw.nbaihub.nhbank)
  host: ""
  # nginx 인그레스 값 — 업로드(최대 200MB) · LLM 응답 대기(최대 180초) 기준. HTTP 면 ssl-redirect "false" 는 차트가 자동으로 붙임
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "210m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  tls:
    # 기본은 HTTP(인증서 없음) — 접속 주소 http://<도메인>, 세션 쿠키 Secure 자동 꺼짐.
    # HTTPS 로 바꿀 때: 인그레스에서 TLS 를 끝내면 true + secretName / 앞단 L7(로드밸런서)에서 끝내면 false 그대로 + app.publicUrl 에 https://<도메인>
    enabled: false
    # [채우기·HTTPS 때만] 인증서 Secret — kubectl -n nhdip create secret tls nhnavi-tls --cert=<crt> --key=<key>
    secretName: ""

app:
  # [채우기·선택] 앞단 L7 에서 TLS 를 끝낼 때만 — 예: https://nhnavi.example.local  (비우면 ingress 값으로 · HTTP 면 http://<도메인>)
  publicUrl: ""
  # 인그레스 앞에 X-Forwarded-For 를 붙이는 로드밸런서가 하나 더 있으면 3
  trustedProxyHops: 2
  # [채우기·권장] 사내 운영 중인 LiteLLM — 최초 기동 때 기본 LLM 연결로 등록(이후 관리자 [LLM 연동]에서 바꿈 · 비우면 거기서 입력)
  #   baseUrl 예: http://dev-aidriven-gw.nbaihub.nhbank  (같은 클러스터면 http://<litellm 서비스>.<네임스페이스>.svc.cluster.local:4000 도 됨)
  #   model  = LiteLLM 에 등록된 모델 이름 · 키는 values 에 쓰지 않고 설치 뒤 관리자 [LLM 연동] 화면에서 입력(DB 에 암호화 저장)
  llm:
    baseUrl: ""
    model: ""
  # [채우기·선택] 사내 SSO(INISAFE Nexess) — 쓰면 enabled: true + 아래 ssoVerifier.enabled: true
  ncSso:
    enabled: false
    loginUrl: "https://sso.nonghyup.com:15502/nls/clientLogin.jsp"
    # 사번 · 비밀번호 로그인 — all(모두) · admin(관리자 비상 로그인만) · none
    localLogin: all
    assets:
      # 서버에 벤더 JS 를 둔 디렉터리 — 예: /opt/nhdip/sso/nc-js
      hostPath: ""
  # [채우기·선택] 운영 알림 메일(비밀번호가 필요하면 설치 뒤 Secret 에 ALERT_SMTP_PASSWORD 추가 — 가이드 §5)
  alerts:
    smtp:
      host: ""
      port: 25
      user: ""
      from: ""
      to: ""

# ── 저장소 (둘 중 하나) ──────────────────────────────────────────
persistence:
  # [채우기·택1] 동적 저장소가 없으면 서버 디렉터리 — 예: /data/nhdip  (pgdata · neo4j · esdata · files 하위 폴더를 만든다)
  hostPathBase: ""
  # [채우기·택1] 저장소 클래스(PVC) — kubectl get storageclass. hostPathBase 를 채우면 쓰지 않는다
  storageClass: ""
  postgres: {size: 50Gi}
  neo4j: {size: 20Gi}
  elasticsearch: {size: 30Gi}
  files: {size: 100Gi, accessMode: ReadWriteOnce}

# ── CPU · 메모리 (requests = 보장 · 스케줄 기준, limits = 상한) ─────────────
# 아래 값은 차트 기본값과 같다 — 서버 사양 · 네임스페이스 ResourceQuota 에 맞게 바꾼다.
# 기본 합계: requests 약 2 vCPU · 5.5GB / limits 약 15 vCPU · 17GB (사내 SSO · LiteLLM 켜면 조금 더)
# 메모리를 바꾸면 자바 힙도 함께: elasticsearch.heap ≤ limits 의 절반 정도 · neo4j heapMax + pageCache < limits
api:
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "4", memory: 4Gi}

worker:
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {cpu: "4", memory: 4Gi}

web:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

postgres:
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}

neo4j:
  heapInitial: 512m
  heapMax: 1g
  pageCache: 512m
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {cpu: "2", memory: 3Gi}

elasticsearch:
  # 서버에서 sysctl vm.max_map_count=262144 를 직접 못 하면 true (특권 컨테이너 허용 필요)
  sysctlInit: false
  heap: 1g
  resources:
    requests: {cpu: 250m, memory: 1536Mi}
    limits: {cpu: "2", memory: 3Gi}

# [채우기·선택] 사내 SSO 검증기 — 서버에 벤더 jar 를 둔 디렉터리
ssoVerifier:
  enabled: false
  libs:
    hostPath: ""
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
