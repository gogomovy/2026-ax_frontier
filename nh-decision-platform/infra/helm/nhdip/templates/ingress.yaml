{{- if .Values.ingress.enabled }}
# 모든 요청은 web(3000)으로 — 화면 API 는 web 이 같은 출처 /backend/* 로 api 에 넘긴다(세션 쿠키 · CSP 유지)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nhdip
  labels:
    {{- include "nhdip.labels" . | nindent 4 }}
  {{- $ann := deepCopy (.Values.ingress.annotations | default dict) }}
  {{- if not (hasPrefix "https://" (include "nhdip.publicUrl" .)) }}
  {{- /* HTTP 배포 — 컨트롤러 전역 https 전환을 이 인그레스에서 끈다(값에 같은 키가 있으면 그 값) */}}
  {{- $_ := set $ann "nginx.ingress.kubernetes.io/ssl-redirect" (get $ann "nginx.ingress.kubernetes.io/ssl-redirect" | default "false") }}
  {{- $_ := set $ann "nginx.ingress.kubernetes.io/force-ssl-redirect" (get $ann "nginx.ingress.kubernetes.io/force-ssl-redirect" | default "false") }}
  {{- end }}
  {{- with $ann }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
{{- end }}
