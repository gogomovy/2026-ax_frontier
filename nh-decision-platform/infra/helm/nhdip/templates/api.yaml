{{- $c := dict "root" . "component" "api" }}
{{- $img := include "nhdip.image" (dict "root" . "image" .Values.images.api "own" true) }}
{{- $assets := .Values.app.ncSso.assets }}
{{- $hasAssets := and .Values.app.ncSso.enabled (or $assets.hostPath $assets.configMap $assets.existingClaim) }}
# 이름 'api' 고정 — 웹 이미지가 http://api:8000 으로 빌드되어 있다
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "nhdip.componentLabels" $c | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "nhdip.selector" $c | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "nhdip.componentLabels" $c | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  # 기동 때 마이그레이션을 하므로 옛 파드를 먼저 내린다
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "nhdip.selector" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nhdip.componentLabels" $c | nindent 8 }}
    spec:
      {{- include "nhdip.podCommon" . | nindent 6 }}
      securityContext:
        fsGroup: 10001
      {{- if .Values.api.filesInit }}
      initContainers:
        # 파일 저장소 준비(compose 의 files-init) — 업로드 원본 · 업무 자료 요청 파일
        - name: files-init
          image: {{ $img }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["sh", "-c", "mkdir -p /data/files/requests && chown -R 10001:10001 /data/files"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: files
              mountPath: /data/files
      {{- end }}
      containers:
        - name: api
          image: {{ $img }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["api"]
          env:
            {{- include "nhdip.apiEnv" . | nindent 12 }}
            - name: RUN_MIGRATIONS
              value: {{ ternary "1" "0" .Values.app.runMigrations | quote }}
            - name: SEED_ON_START
              value: {{ ternary "1" "0" .Values.app.seedOnStart | quote }}
            - name: APP_DB_USER
              value: {{ .Values.app.appDbUser | quote }}
            {{- include "nhdip.secretEnv" (dict "root" . "key" "APP_DB_PASSWORD" "optional" true) | nindent 12 }}
          ports:
            - containerPort: 8000
              name: http
          # 처음 기동은 마이그레이션 · 시드로 오래 걸린다(최대 15분 기다림)
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: files
              mountPath: /data/files
            {{- if $hasAssets }}
            - name: nc-js
              mountPath: /opt/nc-js
              readOnly: true
            {{- end }}
      volumes:
        - name: files
          {{- include "nhdip.dataVolume" (dict "root" . "dir" "files") | trim | nindent 10 }}
        {{- if $hasAssets }}
        - name: nc-js
          {{- include "nhdip.extVolume" $assets | trim | nindent 10 }}
        {{- end }}
