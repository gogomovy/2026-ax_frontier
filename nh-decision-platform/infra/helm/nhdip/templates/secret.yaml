{{- if .Values.secrets.create }}
{{- /*
  비밀값 Secret — helm install 때 무작위 값으로 만든다(파일 · 명령줄에 비밀값이 남지 않음).
  helm upgrade 때는 클러스터에 있는 값을 그대로 쓴다(lookup) — DB 비밀번호 · 암호화 키가 바뀌지 않는다.
  helm uninstall 해도 지우지 않는다(resource-policy: keep) — 다시 설치해도 기존 데이터와 맞는다.
*/ -}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace .Values.secrets.name) | default dict }}
{{- $oldData := (get $old "data") | default dict }}
{{- $gen := dict
  "POSTGRES_PASSWORD" (randAlphaNum 32)
  "NEO4J_PASSWORD" (randAlphaNum 32)
  "APP_DB_PASSWORD" (randAlphaNum 32)
  "ES_PASSWORD" (randAlphaNum 32)
  "SESSION_SECRET" (randAlphaNum 64)
  "CONFIG_ENC_KEY" (randBytes 32)
  "BOOTSTRAP_ADMIN_PASSWORD" (printf "Nh!%s7" (randAlphaNum 10))
  "NC_SSO_VERIFIER_TOKEN" (randAlphaNum 48)
}}
{{- if .Values.litellm.enabled }}
{{- $_ := set $gen "LITELLM_MASTER_KEY" (printf "sk-%s" (randAlphaNum 48)) }}
{{- $_ := set $gen "LITELLM_UI_PASSWORD" (randAlphaNum 24) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "nhdip.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- range $k, $v := $gen }}
  {{ $k }}: {{ get $oldData $k | default ($v | b64enc) | quote }}
{{- end }}
{{- range $k, $v := $oldData }}
{{- if not (hasKey $gen $k) }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
{{- end }}
